name: MAS analysis

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  mas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select real diff
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "MAS_CHANGED_FILES<<EOF" >> "$GITHUB_ENV"
            git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            echo "MAS_CHANGED_FILES<<EOF" >> "$GITHUB_ENV"
            git diff --name-only "$PUSH_BEFORE_SHA" "$PUSH_SHA" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          fi

      - name: Verify MAS policy
        run: npm run mas:verify-policy

      - name: Run MAS tests
        run: npm run mas:test

      - name: Build
        run: npm run build

      - name: Generate consolidated report
        run: npm run mas:report

      - name: Upload MAS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mas-report
          path: |
            .agents/mas/reports/latest.md
            .agents/mas/reports/latest.json

      - name: Update MAS report comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: .agents/mas/reports/latest.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- mas-report -->';
            const body = `${marker}\n${fs.readFileSync(process.env.REPORT_PATH, 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }
